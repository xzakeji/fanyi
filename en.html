<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Translate | English Page</title>
    <!-- favicon 按你项目配置 -->
    <link rel="icon" href="favicon_001.ico" type="image/x-icon">
    <style>
        * {box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui;}
        body {max-width: 1200px; margin: 30px auto; padding: 0 20px;}
        .lang-switch {margin-bottom: 20px;}
        textarea, #translate-result {width: 100%; min-height: 140px; padding: 12px; font-size: 16px; margin:10px 0; border:1px solid #ddd; border-radius:6px;}
        button {padding:10px 20px; cursor:pointer; border:none; border-radius:4px; background:#2563eb; color:#fff; margin:4px;}
        button.read-btn {background:#16a34a;}
        footer {margin-top:40px; padding-top:20px; border-top:1px solid #eee; font-size:13px; color:#666;}
    </style>
</head>
<body>
    <!-- 语言互换按钮 -->
    <div class="lang-switch">
        <span>Language：</span>
        <a href="index.html">中文</a> |
        <a href="ja.html">日本語</a> |
        <strong>English</strong>
    </div>

    <h1>Rocket Translation Tool</h1>

    <!-- 源输入区 -->
    <textarea id="source-text" placeholder="Enter text to translate..."></textarea>

    <!-- 目标语种选择 -->
    <select id="target-lang">
        <option value="zh">Chinese</option>
        <option value="en" selected>English</option>
        <option value="ja">Japanese</option>
    </select>
    <button onclick="startTranslate()">Translate</button>
    <button class="read-btn" onclick="readTranslateText()">Read Translation Aloud</button>

    <!-- 翻译结果 -->
    <div id="translate-result" lang="en"></div>

    <footer>
        <p>Rocket Translation ©2026 | Static open source translation tool, all translation logic runs locally on the page</p>
        <p>Disclaimer: This site does not collect user text data, no ICP filing for overseas access</p>
    </footer>

<script>
// 翻译模拟函数（替换成你实际翻译接口）
function startTranslate() {
    const source = document.getElementById("source-text").value;
    const targetLang = document.getElementById("target-lang").value;
    const resultBox = document.getElementById("translate-result");
    // 更新容器lang属性，同步朗读API
    const langMap = {"zh":"zh-CN","en":"en-US","ja":"ja-JP"};
    resultBox.setAttribute("lang", langMap[targetLang]);
    // 此处替换你的真实翻译请求代码
    resultBox.innerText = `[${targetLang}] Translated content: ` + source;
}

// 修复后多语言朗读核心函数（解决日语无法朗读）
function readTranslateText() {
    const targetText = document.getElementById("translate-result").innerText.trim();
    if (!targetText) return alert("No translated text available");
    const utterance = new SpeechSynthesisUtterance(targetText);
    const targetLang = document.getElementById("target-lang").value;
    switch(targetLang) {
        case "ja":
            utterance.lang = "ja-JP";
            utterance.rate = 0.95;
            break;
        case "en":
            utterance.lang = "en-US";
            utterance.rate = 1;
            break;
        case "zh":
        default:
            utterance.lang = "zh-CN";
            utterance.rate = 1;
    }
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
}

// 页面加载检测日语语音包
window.onload = function() {
    const voices = window.speechSynthesis.getVoices();
    const hasJapaneseVoice = voices.some(v => v.lang.startsWith("ja"));
    if (!hasJapaneseVoice) {
        console.warn("Missing Japanese TTS voice pack, Japanese text cannot be read aloud");
    }
}
</script>
</body>
</html>
