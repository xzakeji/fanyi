<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线翻译器 | 单词句子一键翻译</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background: #f0f4f8;
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 30px;
        }
        .switch-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            align-items: center;
        }
        select, button {
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 15px;
        }
        .box-wrap {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            min-height: 220px;
            padding: 16px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            background: #fff;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        #translateBtn {
            background: #1a73e8;
            color: white;
            border: none;
            cursor: pointer;
        }
        #clearBtn {
            background: #fff;
            color: #555;
            cursor: pointer;
        }
        #copyBtn {
            background: #34a853;
            color: white;
            border: none;
            cursor: pointer;
        }
        .tip {
            margin-top: 16px;
            color: #666;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>简易在线翻译器</h1>

    <div class="switch-row">
        <select id="fromLang">
            <option value="zh">中文</option>
            <option value="en">英语</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
        </select>
        <span>⇄</span>
        <select id="toLang">
            <option value="en">英语</option>
            <option value="zh">中文</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
        </select>
    </div>

    <div class="box-wrap">
        <textarea id="inputText" placeholder="输入单词、短句、长段落均可"></textarea>
        <textarea id="outputText" readonly placeholder="翻译结果会显示在这里"></textarea>
    </div>

    <div class="btn-group">
        <button id="translateBtn">开始翻译</button>
        <button id="clearBtn">清空内容</button>
        <button id="copyBtn">复制译文</button>
    </div>

    <div class="tip">支持单词/整句翻译，免费在线翻译接口</div>

    <script>
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const fromLang = document.getElementById('fromLang');
        const toLang = document.getElementById('toLang');
        const translateBtn = document.getElementById('translateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');

        // 翻译核心函数（免费开源deepl公共中转接口，单词长句通用）
        async function runTranslate() {
            const text = inputText.value.trim();
            if (!text) {
                alert('请输入需要翻译的内容');
                return;
            }
            outputText.value = "翻译加载中...";
            try {
                // 免费公共翻译接口，无需密钥
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromLang.value}|${toLang.value}`);
                const data = await res.json();
                outputText.value = data.responseData.translatedText;
            } catch (err) {
                outputText.value = "翻译接口访问失败，请稍后重试";
            }
        }

        // 翻译按钮点击
        translateBtn.addEventListener('click', runTranslate);
        // 回车快捷翻译
        inputText.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                runTranslate();
            }
        })

        // 清空按钮
        clearBtn.addEventListener('click', () => {
            inputText.value = '';
            outputText.value = '';
        })

        // 复制译文
        copyBtn.addEventListener('click', async () => {
            if (!outputText.value) return;
            await navigator.clipboard.writeText(outputText.value);
            alert('译文复制成功');
        })
    </script>
</body>
</html>
